<!doctype html>
<html lang="en" class="t-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stakeflow: Norwegian shelf production per field and per company, from public Sodir data."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stakeflow · NCS production analytics</title>
    <script>
      // Runs before first paint so a light-theme user never sees a dark flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('stakeflow-theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.className = 't-' + theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
