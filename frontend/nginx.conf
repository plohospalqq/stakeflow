server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers on every response, including /api and errors (`always`).
    # Pitfall: by default an add_header inside a location *replaces* everything set here, so a
    # location that only adds Cache-Control silently drops the CSP. `merge` (nginx 1.29.3+)
    # appends a location's headers to these instead, so locations add only what differs.
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # No inline scripts and no <style> elements. Inline style *attributes* are allowed because
    # ECharts writes its HTML tooltips with innerHTML (style="..." on every row); attributes
    # cannot carry selectors, so this does not open CSS-based data exfiltration.
    # MapLibre fetches the OpenFreeMap style, tiles, glyphs and sprites, runs its worker from a
    # blob: URL and draws its control icons from data: SVGs; one font subset is a data: URI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Same-origin API: the browser never talks to the API container directly, so no CORS.
    # Cache-Control and ETag come from the API itself.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change; cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/fields/123, /companies/aker-bp) all load the app shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
