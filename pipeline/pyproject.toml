[project]
name = "stakeflow-pipeline"
version = "0.1.0"
description = "Sodir ingestion and transformations for Stakeflow"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.29",
    "dagster-dbt>=0.29.29",
    "dagster-postgres>=0.29.29",
    "dagster-webserver>=1.13.29",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "scipy>=1.18.1",
    # SQLAlchemy 2.1 defaults postgresql:// to psycopg 3, which breaks dagster-postgres
    # (`NOTIFY run_events, $1`). Remove the pin once dagster-postgres supports it.
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
stakeflow-ingest = "stakeflow_pipeline.ingest:main"
stakeflow-load-snapshot = "stakeflow_pipeline.snapshot_files:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (make up)"]

[tool.dagster]
module_name = "stakeflow_pipeline.definitions"
code_location_name = "stakeflow"
