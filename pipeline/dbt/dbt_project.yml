name: stakeflow
version: "1.0.0"
config-version: 2
profile: stakeflow

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  stakeflow:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    # API-facing views of the forecast run's output (ml schema). Built after the run, so they
    # are tagged: `dbt build --exclude tag:ml`, forecast, then `dbt build --select tag:ml`
    ml:
      +schema: marts
      +materialized: table
      +tags: [ml]

seeds:
  stakeflow:
    +schema: marts
