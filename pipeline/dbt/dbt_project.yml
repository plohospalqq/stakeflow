name: stakeflow
version: "1.0.0"
config-version: 2
profile: stakeflow

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

on-run-start:
  - "{{ create_external_tables() }}"

models:
  stakeflow:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    # The latest ML run, exposed to the API. Views, so they show a new run the moment the
    # Python asset writes it; tag `ml` lets Dagster build them after the ML assets.
    marts_ml:
      +schema: marts
      +materialized: view
      +tags: [ml]

seeds:
  stakeflow:
    +schema: marts
