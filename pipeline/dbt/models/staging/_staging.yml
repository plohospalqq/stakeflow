version: 2

models:
  - name: stg_sodir__companies
    description: Latest Sodir company snapshot, typed.
    columns:
      - name: company_id
        tests: [unique, not_null]
  - name: stg_sodir__fields
    description: Latest field snapshot. Geometry repaired with ST_MakeValid and cast to MultiPolygon, EPSG:4326.
    columns:
      - name: field_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments: {values: ["Producing", "Shut down", "Approved for production"]}
  - name: stg_sodir__field_licensees
    description: Field ownership periods. valid_to is exclusive (Sodir's inclusive "to" + 1 day).
    tests:
      - no_overlapping_intervals:
          arguments: {partition_by: [field_id, company_id]}
    columns:
      - name: share_pct
        tests:
          - not_null
          - dbt_expression_between:
              arguments: {min: 0, max: 100}
  - name: stg_sodir__production_monthly
    description: Monthly net (saleable) production per field in Sm³.
    tests:
      - unique_combination:
          arguments: {columns: [field_id, month]}
  - name: stg_sodir__ingestion_runs
  - name: stg_sodir__production_snapshots

  - name: stg_market__brent_daily
    description: EIA Brent spot FOB, USD per barrel, newest value per trading day.
    tests:
      - max_gap_days:
          arguments: {column_name: date, max_days: 7}
    columns:
      - name: date
        tests: [unique, not_null]
      - name: unit
        tests:
          - accepted_values:
              arguments: {values: ["$/BBL"]}
      - name: brent_usd_bbl
        tests:
          - not_null
          - dbt_expression_between:
              arguments: {min: 5, max: 400}
  - name: stg_market__fx_daily
    description: ECB EUR/USD and EUR/NOK reference rates; USD/NOK is our cross rate.
    tests:
      - max_gap_days:
          arguments: {column_name: date, max_days: 7}
    columns:
      - name: date
        tests: [unique, not_null]
      - name: eurusd
        tests:
          - dbt_expression_between:
              arguments: {min: 0.5, max: 2}
      - name: usdnok
        tests:
          - dbt_expression_between:
              arguments: {min: 4, max: 25}
  - name: stg_market__pink_sheet_monthly
    description: World Bank monthly Natural gas Europe (TTF from 2015-04) and Brent, USD.
    tests:
      - max_gap_days:
          arguments: {column_name: month, max_days: 31}
    columns:
      - name: month
        tests: [unique, not_null]
      - name: ttf_unit
        tests:
          - accepted_values:
              arguments: {values: ["$/mmbtu"]}
      - name: brent_unit
        tests:
          - accepted_values:
              arguments: {values: ["$/bbl"]}
  - name: stg_market__share_prices_daily
    description: User-imported daily closes (local only).
    tests:
      - unique_combination:
          arguments: {columns: [ticker, date]}
      - max_gap_days:
          arguments: {column_name: date, max_days: 7, partition_by: [ticker]}
    columns:
      - name: currency
        tests:
          - accepted_values:
              arguments: {values: ["NOK"]}
      - name: close
        tests:
          - not_null
          - dbt_expression_between:
              arguments: {min: 0.01, max: 100000}
