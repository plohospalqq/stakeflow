version: 2

seeds:
  - name: company_groups
    description: >
      Curated corporate groups. Sodir's own cmpGroup is inconsistent, so economic groups are
      maintained here. Companies not listed get a group of their own.
    config:
      column_types: {group_id: text, display_name: text, is_focus: boolean, scope_note: text}
    columns:
      - name: group_id
        tests: [unique, not_null]
  - name: company_group_members
    description: >
      Legal entity → group. Static on purpose: M&A on the shelf moves shares to new legal
      entities (Lundin Energy Norway → ABP Norway on 2022-06-30), so a static map keeps history
      right without back-dating a merger.
    config:
      column_types: {company_id: integer, group_id: text, note: text}
    columns:
      - name: company_id
        tests: [unique, not_null]
      - name: group_id
        tests:
          - relationships:
              arguments: {to: ref('company_groups'), field: group_id}
  - name: company_reporting
    description: >
      When each focus company first publishes quarterly production (docs/nowcast-feasibility.md):
      days after quarter end and in which document. Sets expected_report_on for predictions.
    config:
      column_types: {group_id: text, report_kind: text, report_lag_days: integer, note: text}
    columns:
      - name: group_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('company_groups'), field: group_id}
      - name: report_kind
        tests:
          - accepted_values:
              arguments: {values: [trading update, quarterly report]}
  - name: reported_quarterly_production
    description: >
      Production the companies themselves reported (kboe/d, quarterly average), copied by hand
      from the first public document that carried each figure (trading update, or Equinor's
      quarterly report for its E&P Norway segment), with the source link. published_on is the
      first publication date, because forecasts are scored against what was public at the time. Ground truth for reconciliation and,
      later, for scoring forecasts. Append rows; never edit old ones.
    config:
      column_types: {group_id: text, quarter_start: date, reported_kboe_d: numeric, published_on: date, document: text, source_url: text, notes: text}
    tests:
      - unique_combination:
          arguments: {columns: [group_id, quarter_start]}
    columns:
      - name: quarter_start
        description: First day of the quarter.
      - name: reported_kboe_d
        description: Reported production, thousand boe per day (quarter average).
      - name: published_on
        description: Date the company published the figure.
      - name: group_id
        tests:
          - relationships:
              arguments: {to: ref('company_groups'), field: group_id}
  - name: share_listings
    description: >
      Where each focus company's share trades. The share importer checks a file's ISIN against
      this list, so a CSV saved under the wrong ticker is rejected.
    config:
      column_types: {group_id: text, ticker: text, isin: text, exchange: text, currency: text, listed_on: date, note: text}
    columns:
      - name: ticker
        tests: [unique, not_null]
      - name: group_id
        tests:
          - unique
          - relationships:
              arguments: {to: ref('company_groups'), field: group_id}
  - name: price_series
    description: Catalogue of price series served by /prices, with unit, source and licence.
    config:
      column_types: {series_id: text, name: text, unit: text, frequency: text, source: text, source_url: text, licence: text, attribution: text}
    columns:
      - name: series_id
        tests: [unique, not_null]
