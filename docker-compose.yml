name: stakeflow

x-pipeline: &pipeline
  build: pipeline
  image: stakeflow-pipeline
  env_file: .env
  environment:
    # Inside the compose network the database is `db:5432`, not localhost:5433
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DAGSTER_PG_DB: dagster
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    build: infra/postgres
    image: stakeflow-db:17
    env_file: .env
    # Like the other services: come back after a Docker or machine restart
    restart: unless-stopped
    ports:
      # Localhost only: never expose the database to the LAN
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dagster-webserver:
    <<: *pipeline
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 10s
      timeout: 5s
      retries: 12

  dagster-daemon:
    <<: *pipeline
    # Runs schedules, sensors and queued runs
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml

  api:
    build: api
    image: stakeflow-api
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Only the Vite dev server needs CORS; in Docker the UI reaches the API through nginx
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build: frontend
    image: stakeflow-frontend
    ports:
      - "127.0.0.1:3002:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
